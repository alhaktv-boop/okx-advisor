name: Advisor (paper trading)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: advisor
  cancel-in-progress: false
jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m advisor.live
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        run: |
          git config user.name "advisor-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase -q && git push -q)
