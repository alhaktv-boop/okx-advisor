name: Experiment (walk-forward)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  exp:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: python -m advisor.experiment
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save result
        run: |
          git config user.name "advisor-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/experiments.md
          git diff --cached --quiet || (git commit -m "experiment result" && git pull --rebase -q && git push -q)
