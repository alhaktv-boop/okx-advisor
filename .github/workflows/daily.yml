name: Daily strategies study
on: workflow_dispatch
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python -m advisor.daily 1500
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save result
        run: |
          git config user.name "advisor-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/daily.md
          git diff --cached --quiet || (git commit -m "daily study result" && git pull --rebase -q && git push -q)
